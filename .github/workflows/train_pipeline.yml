name: Train Agriculture AI Model

on:
  push:
    branches:
      - automation-pipeline

permissions:
  contents: write

jobs:
  train-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Crop Training Script
        run: |
          python scripts/train_crop_model.py

      - name: Generate Training Blog
        run: |
          python scripts/generate_training_blog.py

      - name: Commit training report
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add blogs/training_report.md
          git commit -m "Auto update training report" || echo "No changes to commit"
          git push

      - name: Run OpenClaw Monitor
        run: |
          python scripts/openclaw_monitor.py

      - name: Create issue if model accuracy drops
        if: always()
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Model Performance Alert"
          content-filepath: reports/issue.txt
          labels: ml-monitoring
      
      - name: Upload trained model
        uses: actions/upload-artifact@v4
        with:
          name: crop-model
          path: models/crop_model.pkl

      - name: Upload training report
        uses: actions/upload-artifact@v4
        with:
          name: training-report
          path: blogs/training_report.md

      