name: Train Agriculture AI Model

on:
  push:
    branches:
      - automation-pipeline

jobs:
  train-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Crop Training Script
        run: |
          python scripts/train_crop_model.py

      - name: Generate Training Blog
        run: |
          python scripts/generate_training_blog.py

      - name: Verify Model Output
        run: |
          ls models